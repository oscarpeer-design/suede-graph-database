<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suede Graph Visualiser</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --ink: #1a1a1e;
            --ink-soft: #55555f;
            --ink-muted: #8a8a94;
            --border: #e2e2e8;
            --accent: #3b5bdb;
            --edge: #b9bcc6;
            --highlight: #e8590c; /* MATCH traversal highlight */
            --danger-bg: #fdecec;
            --danger-ink: #b42318;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--ink);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 0 0 auto;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

            .title-row h1 {
                font-size: 16px;
                margin: 0;
                font-weight: 650;
            }

            .title-row .sub {
                font-size: 12px;
                color: var(--ink-muted);
            }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

            .controls input[type=text] {
                font: inherit;
                font-size: 13px;
                padding: 6px 9px;
                border: 1px solid var(--border);
                border-radius: 7px;
                background: #fff;
                color: var(--ink);
            }

        #token {
            width: 300px;
        }

        #query {
            flex: 1 1 340px;
            min-width: 240px;
        }

        button {
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 14px;
            border: 1px solid var(--accent);
            border-radius: 7px;
            background: var(--accent);
            color: #fff;
        }

            button.secondary {
                background: #fff;
                color: var(--ink-soft);
                border-color: var(--border);
            }

            button:active {
                transform: translateY(1px);
            }

            button:disabled {
                cursor: default;
                opacity: .45;
            }

                button:disabled:active {
                    transform: none;
                }

        #status {
            font-size: 12.5px;
            min-height: 18px;
            padding: 2px 0;
        }

            #status.error {
                color: var(--danger-ink);
            }

            #status.ok {
                color: var(--ink-soft);
            }

        main {
            flex: 1 1 auto;
            display: flex;
            min-height: 0;
        }

        #canvas-wrap {
            flex: 1 1 auto;
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

            svg.panning {
                cursor: grabbing;
            }

        .edge {
            stroke: var(--edge);
            stroke-width: 2;
        }

            .edge.hl {
                stroke: var(--highlight);
                stroke-width: 3;
            }

        .edge-label {
            fill: var(--ink-muted);
            font-size: 10px;
            pointer-events: none;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
        }

        .node.hl circle {
            stroke: var(--highlight);
            stroke-width: 4;
        }

        .node.selected circle {
            stroke: var(--ink);
            stroke-width: 4;
        }

        .node-label {
            fill: var(--ink);
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
            text-anchor: middle;
            paint-order: stroke;
            stroke: var(--bg);
            stroke-width: 3px;
        }

        /* side panel */
        #side {
            flex: 0 0 300px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 14px;
            overflow-y: auto;
            font-size: 13px;
        }

            #side h2 {
                font-size: 13px;
                margin: 0 0 8px;
                text-transform: uppercase;
                letter-spacing: .04em;
                color: var(--ink-muted);
            }

            #side .empty {
                color: var(--ink-muted);
                font-style: italic;
            }

        .kv {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 4px 10px;
            margin-top: 6px;
        }

            .kv dt {
                color: var(--ink-muted);
            }

            .kv dd {
                margin: 0;
                word-break: break-word;
            }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
        }

        /* legend */
        #legend {
            margin-top: 16px;
        }

            #legend .row {
                display: flex;
                align-items: center;
                gap: 7px;
                margin: 3px 0;
                font-size: 12px;
            }

            #legend .sw {
                width: 12px;
                height: 12px;
                border-radius: 3px;
                flex: 0 0 auto;
            }

        .hint {
            font-size: 11px;
            color: var(--ink-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-row">
            <h1>Suede Graph Visualiser</h1>
            <span class="sub">nodes &amp; edges from your query, drawn live</span>
        </div>
        <div class="controls">
            <input type="text" id="token" placeholder="Bearer token (from: SuedeServer --mint &lt;ip&gt;)" autocomplete="off" spellcheck="false">
            <input type="text" id="query" placeholder="e.g.  SELECT * FROM GRAPH  |  SELECT * FROM NODES WHERE LABEL = 'Person'  |  MATCH REACHABLE FROM 1"
                   value="SELECT * FROM GRAPH">
            <button id="run">Run</button>
            <button id="refresh" class="secondary" title="Re-run your last graph query (e.g. after an INSERT)">Refresh</button>
            <button id="fit" class="secondary" title="Fit graph to view">Fit</button>
        </div>
        <div id="status" class="ok">Enter a token and a query, then Run. After an INSERT/UPDATE, click Refresh to update the graph. The token is remembered for this tab only.</div>
    </header>

    <main>
        <div id="canvas-wrap">
            <svg id="svg">
                <defs>
                    <!-- arrowhead for edge direction -->
                    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                        <path d="M0,0 L10,5 L0,10 z" fill="#b9bcc6"></path>
                    </marker>
                    <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                        <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"></path>
                    </marker>
                </defs>
                <g id="viewport">
                    <g id="edges-layer"></g>
                    <g id="nodes-layer"></g>
                </g>
            </svg>
        </div>

        <aside id="side">
            <h2>Selection</h2>
            <div id="detail"><p class="empty">Click a node to see its properties.</p></div>
            <div id="legend"></div>
        </aside>
    </main>

    <script>
        "use strict";
        // ===========================================================================
        // Suede Graph Visualiser -- self-contained, dependency-free.
        //
        // This page is served BY the SuedeServer (its GET / route), so it calls the API
        // on its OWN origin with a relative fetch("/query") -- that means the browser
        // treats it as same-origin and there is NO CORS involved. The user supplies a
        // bearer token; every /query call carries "Authorization: Bearer <token>".
        //
        // End-to-end pipeline:
        //   1. runQuery()      POST the command to /query, get back {nodes,edges,traversal}
        //   2. ingestResult()  turn that JSON into drawable node/edge objects
        //   3. computeLayout() position nodes with a force-directed simulation
        //   4. render()        draw everything as SVG (then drag / zoom / pan / click)
        // A MATCH query's returned path is highlighted; clicking a node shows its props.
        // ===========================================================================

        const SVG_NAMESPACE = "http://www.w3.org/2000/svg";

        // tiny helper: look up an element by id (used constantly below).
        function byElementId(id) { return document.getElementById(id); }

        // ---------------------------------------------------------------------------
        // Bearer token: remembered for THIS browser tab only (sessionStorage). It is
        // never sent anywhere except the same-origin /query call. sessionStorage access
        // is wrapped in try/catch because some privacy modes throw on it.
        // ---------------------------------------------------------------------------
        const tokenInput = byElementId("token");
        try { tokenInput.value = sessionStorage.getItem("suede_token") || ""; } catch (e) { }
        tokenInput.addEventListener("input", () => {
            try { sessionStorage.setItem("suede_token", tokenInput.value); } catch (e) { }
        });

        // ---------------------------------------------------------------------------
        // Status line under the controls. `kind` is "ok" or "error" (drives colour).
        // ---------------------------------------------------------------------------
        function setStatus(message, kind) {
            const statusEl = byElementId("status");
            statusEl.textContent = message;
            statusEl.className = kind || "ok";
        }

        // ===========================================================================
        // Colour-by-label: each distinct node label gets a fixed colour, assigned in
        // order the first time that label is seen and never changed afterwards (so a
        // label keeps its colour across re-queries within a session). Colour only ever
        // carries node identity; the legend repeats it in words so identity is never
        // colour-alone. The palette is a brand-neutral, colourblind-aware set.
        // ===========================================================================
        const LABEL_PALETTE = [
            "#3b5bdb", "#2f9e44", "#e8590c", "#9c36b5", "#0c8599",
            "#e03131", "#5c940d", "#1864ab", "#c2255c", "#495057"
        ];
        const colourByLabel = new Map();    // label -> hex colour
        let nextPaletteIndex = 0;
        function colourForLabel(label) {
            if (!colourByLabel.has(label)) {
                colourByLabel.set(label, LABEL_PALETTE[nextPaletteIndex % LABEL_PALETTE.length]);
                nextPaletteIndex++;
            }
            return colourByLabel.get(label);
        }

        // ===========================================================================
        // Graph state (the current thing being displayed).
        // ===========================================================================
        // Each node: { id, label, properties, x, y, velocityX, velocityY }
        let graphNodes = [];
        // Each edge: { fromId, toId, label }
        let graphEdges = [];
        // Fast id -> node lookup, rebuilt whenever graphNodes changes.
        let nodeLookup = new Map();
        // Node ids that are part of a MATCH traversal (drawn highlighted).
        let highlightedNodeIds = new Set();
        // The currently clicked/selected node id (or null).
        let selectedNodeId = null;

        // The pan/zoom transform applied to the whole drawing:
        //   panX / panY = translation in screen pixels, zoom = scale factor.
        let camera = { panX: 0, panY: 0, zoom: 1 };

        // The last READ query (SELECT / MATCH) that successfully drew a graph.
        // The Refresh button re-runs this so you can see the effect of a mutation
        // (INSERT / UPDATE / DELETE) without it silently redrawing on you.
        let lastReadQuery = null;

        // In-flight guard. runQuery() is async (it awaits a fetch, then runs a
        // synchronous force layout). Without this flag, a second click while a query
        // is still running fires a SECOND overlapping request -- two responses then
        // race to draw, and because the layout blocks the main thread the page feels
        // frozen, so the user clicks again. That is the "wait and double-click" bug.
        // While a query runs we ignore new triggers and disable Run/Refresh so a
        // click can't be lost and the busy state is visible.
        let queryInProgress = false;

        // Reflect the busy state on the controls: disable Run/Refresh and dim them
        // while a query runs, re-enable when it finishes. Purely visual feedback +
        // a hard guard so overlapping runs cannot start.
        function setBusy(busy) {
            queryInProgress = busy;
            byElementId("run").disabled = busy;
            byElementId("refresh").disabled = busy;
        }

        // ===========================================================================
        // Step 1: run a query against the server.
        // ===========================================================================
        async function runQuery() {
            // Guard: if a query is already running, ignore this trigger entirely.
            // This is what stops a fast second click from firing a second request.
            if (queryInProgress) return;

            const token = tokenInput.value.trim();
            const command = byElementId("query").value.trim();
            if (!token) { setStatus("Enter a bearer token first.", "error"); return; }
            if (!command) { setStatus("Enter a query first.", "error"); return; }

            setBusy(true);
            setStatus("Running...", "ok");
            // Yield one frame so the "Running..." status + disabled buttons actually
            // PAINT before the (synchronous, main-thread-blocking) force layout runs.
            // Without this, the status change and the freeze happen in the same tick,
            // so the user never sees feedback -- the page just locks then updates.
            await new Promise(requestAnimationFrame);

            // Everything below runs inside try/finally so setBusy(false) ALWAYS runs,
            // on every exit path (success, network error, non-2xx, non-JSON), and the
            // buttons can never get stuck disabled.
            try {

            let response, resultJson, rawResponseText;
            try {
                response = await fetch("/query", {            // relative URL -> same origin -> no CORS
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ command })
                });
                rawResponseText = await response.text();
                try { resultJson = JSON.parse(rawResponseText); } catch (e) { resultJson = null; }
            } catch (networkError) {
                setStatus("Could not reach the server: " + networkError.message, "error");
                return;
            }

            // Non-2xx: surface the server's own error contract (400 bad request,
            // 422 rejected-or-unauthorised, etc.) using its error/message field.
            if (!response.ok) {
                const serverMessage =
                    (resultJson && (resultJson.error || resultJson.message))
                        ? (resultJson.error || resultJson.message)
                        : rawResponseText;
                setStatus("Server " + response.status + ": " + serverMessage, "error");
                return;
            }
            if (!resultJson) {
                setStatus("Server returned non-JSON: " + rawResponseText.slice(0, 200), "error");
                return;
            }

            // Decide whether this result should REPLACE the drawing. The rule has
            // TWO parts, and both must pass to redraw:
            //
            //   1. It must NOT be a mutation. INSERT / UPDATE / DELETE (and
            //      persistence / snapshot commands) never redraw -- even though an
            //      INSERT *does* return its one new node, drawing that node would
            //      replace the whole graph with a single dot. A mutation only changes
            //      the underlying data; to SEE the change you re-run a read (Refresh).
            //   2. It must actually have rows to draw -- node rows, edge rows, or a
            //      MATCH traversal. This is what stops a COUNT (a number, no rows) or a
            //      zero-match read from blanking the canvas.
            //
            // Everything that fails either part leaves the current drawing exactly as
            // it is and just reports to the status line. That is what makes the graph
            // persist visibly across every command that has nothing new to show.
            const firstKeyword = command.split(/\s+/)[0].toUpperCase();
            const isMutation =
                firstKeyword === "INSERT" || firstKeyword === "UPDATE" ||
                firstKeyword === "DELETE";

            const hasRows =
                (Array.isArray(resultJson.nodes) && resultJson.nodes.length > 0) ||
                (Array.isArray(resultJson.edges) && resultJson.edges.length > 0) ||
                (Array.isArray(resultJson.traversal) && resultJson.traversal.length > 0);

            const shouldRedraw = !isMutation && hasRows;

            if (!shouldRedraw) {
                // Not redrawing -> keep the current view exactly as it is and just
                // report the message. The drawing is never cleared. (A mutation adds a
                // nudge to Refresh, since re-running the last read is how you see it.)
                setStatus(
                    (resultJson.message || "OK") +
                    (isMutation && lastReadQuery !== null
                        ? "  — click Refresh to update the graph"
                        : ""),
                    "ok");
                return;
            }

            ingestResult(resultJson);

            // Remember this read so Refresh can replay it (e.g. after an INSERT).
            // Only a query that actually drew a graph is remembered -- a COUNT or an
            // empty result never becomes the thing Refresh would replay.
            lastReadQuery = command;

            // If the server capped a full scan, say so plainly -- a partial graph
            // should never look like the whole one. `truncated` / `totalMatched`
            // come from the QueryResult (see Json.h); older servers that don't send
            // them simply leave `truncated` undefined, so this note is skipped.
            let truncationNote = "";
            if (resultJson.truncated) {
                const total = resultJson.totalMatched;
                truncationNote = total
                    ? "  ⚠ showing " + graphNodes.length + " of " + total +
                    " — add TOP <n> to see more"
                    : "  ⚠ result was capped — add TOP <n> to see more";
            }

            setStatus(
                (resultJson.message ? resultJson.message + "  " : "") +
                "(" + graphNodes.length + " nodes, " + graphEdges.length + " edges" +
                (highlightedNodeIds.size ? ", " + highlightedNodeIds.size + " in path" : "") + ")" +
                truncationNote,
                "ok");

            } finally {
                // Whatever happened above -- success, an early return, or a thrown
                // error -- clear the busy state so the buttons work again. This is the
                // single place the guard is released, so it can never get stuck.
                setBusy(false);
            }
        }

        // ===========================================================================
        // Step 2: turn a server QueryResult {nodes, edges, traversal} into the
        // graphNodes / graphEdges we draw.
        // ===========================================================================
        function ingestResult(result) {
            const returnedNodes = Array.isArray(result.nodes) ? result.nodes : [];
            const returnedEdges = Array.isArray(result.edges) ? result.edges : [];
            const traversalIds = Array.isArray(result.traversal) ? result.traversal : [];

            // Collect the nodes to draw, keyed by id. A MATCH usually returns ONLY the
            // traversal (a list of ids) with no node rows, so for any traversal id we
            // don't have a full row for, we synthesise a bare stub so the path can draw.
            const nodesById = new Map();
            for (const node of returnedNodes) {
                nodesById.set(node.id, {
                    id: node.id,
                    label: node.label || "",
                    properties: node.properties || {}
                });
            }
            for (const id of traversalIds) {
                if (!nodesById.has(id)) nodesById.set(id, { id, label: "", properties: {} });
            }

            // Collect edges. For each edge, ensure BOTH endpoints exist as nodes -- if an
            // endpoint isn't in the result (e.g. SELECT * FROM EDGES returns edge rows
            // that reference nodes BY ID ONLY, with no node payload), synthesise a bare
            // stub node for it rather than dropping the edge. Without this, an edge-only
            // query has an empty node set, every edge fails a "both endpoints known"
            // check, and the canvas is blank. The stub draws as a "#id" circle; running
            // SELECT * FROM GRAPH instead fills in the real labels/properties. (This
            // mirrors Neo4j Browser's "connect result nodes": an edge implies its two
            // endpoints, so we always draw them.) A real node row for the same id, if it
            // arrives in this or a later query, takes precedence over the stub.
            const edgesToDraw = [];
            for (const edge of returnedEdges) {
                if (!nodesById.has(edge.from))
                    nodesById.set(edge.from, { id: edge.from, label: "", properties: {} });
                if (!nodesById.has(edge.to))
                    nodesById.set(edge.to, { id: edge.to, label: "", properties: {} });
                edgesToDraw.push({ fromId: edge.from, toId: edge.to, label: edge.label || "" });
            }
            if (edgesToDraw.length === 0 && traversalIds.length >= 2) {
                for (let i = 0; i + 1 < traversalIds.length; i++)
                    edgesToDraw.push({ fromId: traversalIds[i], toId: traversalIds[i + 1], label: "" });
            }

            // Remember where nodes we've seen before were, so a re-query keeps the layout
            // stable instead of jumping everything to new random spots.
            const previousPositions = new Map(graphNodes.map(n => [n.id, { x: n.x, y: n.y }]));

            const canvas = byElementId("canvas-wrap");
            const canvasWidth = canvas.clientWidth || 800;
            const canvasHeight = canvas.clientHeight || 600;

            // Initial placement: lay NEW nodes evenly around a ring centred on the canvas
            // (not a tiny random cluster). The ring matters because: (a) a random cluster
            // can drop nodes almost on top of each other -- and two at the EXACT same
            // point have an undefined repulsion direction, so they'd never separate; and
            // (b) edge-less nodes have no springs pulling them into a shape, so a good
            // starting spread is the main thing keeping them apart. Previously-seen nodes
            // keep their old position for stability.
            graphNodes = [];
            nodeLookup = new Map();
            const nodeCount = nodesById.size;
            const ringRadius = Math.min(canvasWidth, canvasHeight) * 0.32 + nodeCount * 4;
            let placementIndex = 0;
            for (const nodeData of nodesById.values()) {
                const previous = previousPositions.get(nodeData.id);
                const angle = (placementIndex / Math.max(nodeCount, 1)) * Math.PI * 2;
                const node = {
                    ...nodeData,
                    x: previous ? previous.x : (canvasWidth / 2 + Math.cos(angle) * ringRadius),
                    y: previous ? previous.y : (canvasHeight / 2 + Math.sin(angle) * ringRadius),
                    velocityX: 0,
                    velocityY: 0
                };
                graphNodes.push(node);
                nodeLookup.set(node.id, node);
                placementIndex++;
            }

            graphEdges = edgesToDraw;
            highlightedNodeIds = new Set(traversalIds);
            selectedNodeId = null;
            renderSelectionPanel(null);
            renderLegend();

            computeLayout();
            render();
            fitToView();
        }

        // ===========================================================================
        // Spatial grid -- the optimisation that makes the layout scale.
        //
        // A naive force layout compares every node with every other node: O(N^2) per
        // iteration, which freezes the tab at a thousand nodes. But two nodes only
        // interact when they are within some cutoff distance (repulsion has a cutoff;
        // the min-separation pass only cares about pairs closer than MIN_SEPARATION).
        // So we bucket nodes into square cells whose side is that cutoff, and then a
        // node only needs to be compared with nodes in its OWN cell and the 8
        // neighbouring cells -- everything further away is, by construction, beyond
        // the cutoff and contributes nothing. For a roughly even spread that is O(N).
        //
        // buildGrid(cellSize) returns { cellOf(node) -> "cx,cy" key, cells: Map<key,
        // node[]>, neighbours(node) -> node[] } for the CURRENT node positions. It is
        // rebuilt each iteration because nodes move; bucketing is itself O(N), cheap.
        // Correctness hinges on cellSize >= the interaction cutoff: then any pair
        // within the cutoff necessarily falls in the same or an adjacent cell, so the
        // 3x3 neighbourhood scan can never miss an interacting pair.
        // ===========================================================================
        function buildGrid(nodes, cellSize) {
            const cells = new Map();               // "cx,cy" -> array of nodes in that cell
            const cellIndex = (v) => Math.floor(v / cellSize);
            for (const node of nodes) {
                const key = cellIndex(node.x) + "," + cellIndex(node.y);
                let bucket = cells.get(key);
                if (!bucket) { bucket = []; cells.set(key, bucket); }
                bucket.push(node);
            }
            // Return every node in the 3x3 block of cells around `node` (itself
            // included). Callers skip the self-pair explicitly.
            function neighbours(node) {
                const cx = cellIndex(node.x), cy = cellIndex(node.y);
                const out = [];
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const bucket = cells.get((cx + dx) + "," + (cy + dy));
                        if (bucket) for (const other of bucket) out.push(other);
                    }
                }
                return out;
            }
            return { neighbours };
        }

        // ===========================================================================
        // Step 3: force-directed layout (a Fruchterman-Reingold-style simulation).
        //
        // The idea: treat every node as a charged particle that PUSHES all other nodes
        // away (repulsion), and every edge as a SPRING that pulls its two endpoints
        // together (attraction). Iterating these forces, with a "temperature" that
        // shrinks each round so motion settles, arranges the graph into the familiar
        // spread-out, edges-roughly-even shape. A final pass guarantees no overlap.
        //
        // Repulsion and the min-separation pass both use a SPATIAL GRID (see
        // buildGrid) so each is ~O(N) per iteration instead of O(N^2) -- this is what
        // lets a full 1000-node SELECT * FROM GRAPH lay out without freezing. Because
        // repulsion already had a hard REPULSION_CUTOFF, the grid computes exactly the
        // same forces as the old all-pairs loop did (it only skips pairs the cutoff
        // was already zeroing), so the resulting layout is unchanged -- just faster.
        // ===========================================================================
        function computeLayout() {
            const nodeCount = graphNodes.length;
            if (nodeCount === 0) return;

            const canvas = byElementId("canvas-wrap");
            const canvasWidth = canvas.clientWidth || 800;
            const canvasHeight = canvas.clientHeight || 600;
            const centreX = canvasWidth / 2, centreY = canvasHeight / 2;

            // idealDistance is the target spacing between nodes. It is derived from how
            // much canvas area each node has to itself, BUT CLAMPED to a fixed on-screen
            // range. Without the clamp, a big window makes this large (e.g. ~425px for a
            // few nodes on a 1200x800 canvas), the repulsion force -- which scales with
            // idealDistance^2 -- then blows the graph up to thousands of pixels across,
            // and fitToView has to zoom way out to catch it, leaving tiny nodes marooned
            // in empty space. Clamping to ~[70, 130] keeps spacing readable and roughly
            // constant regardless of monitor size, so the graph stays a compact cluster.
            const IDEAL_MIN = 70, IDEAL_MAX = 130;
            const rawIdeal = Math.sqrt((canvasWidth * canvasHeight) / nodeCount) * 0.75;
            const idealDistance = Math.max(IDEAL_MIN, Math.min(rawIdeal, IDEAL_MAX));
            const ITERATIONS = 300;
            let temperature = canvasWidth / 8;   // caps how far a node may move per round

            // Repulsion only acts within this cutoff. Beyond it, two nodes stop
            // pushing each other apart -- crucial for DISCONNECTED nodes: with no edge
            // spring to counter it, unbounded repulsion would push a pair apart until
            // it only balanced the (weak) centre-pull, settling them very far apart
            // (the "2 nodes 1300px apart" case). Capping repulsion range lets the
            // centre-pull win at long range and gather loose nodes into a compact
            // cluster, while short-range repulsion + the MIN_SEPARATION pass still keep
            // them from overlapping. ~3x idealDistance is enough to space neighbours.
            const REPULSION_CUTOFF = idealDistance * 3;

            for (let iteration = 0; iteration < ITERATIONS; iteration++) {
                // --- repulsion: every node pushes nearby nodes apart, within
                //     REPULSION_CUTOFF. Uses the spatial grid: a node is only compared
                //     with nodes in its own + neighbouring cells (cell size = the
                //     cutoff), so pairs beyond the cutoff -- which contribute zero
                //     force anyway -- are never even examined. ~O(N) per iteration
                //     instead of O(N^2). Force grows as nodes get closer. ---
                for (const node of graphNodes) {
                    node.velocityX = 0;
                    node.velocityY = 0;
                }
                const repulsionGrid = buildGrid(graphNodes, REPULSION_CUTOFF);
                for (const node of graphNodes) {
                    for (const other of repulsionGrid.neighbours(node)) {
                        if (other === node) continue;
                        let deltaX = node.x - other.x;
                        let deltaY = node.y - other.y;
                        let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY) || 0.01;
                        if (distance > REPULSION_CUTOFF) continue;   // too far to interact
                        const repulsion = (idealDistance * idealDistance) / distance;
                        node.velocityX += (deltaX / distance) * repulsion;
                        node.velocityY += (deltaY / distance) * repulsion;
                    }
                }

                // --- attraction: each edge is a spring pulling its endpoints together.
                //     Force grows with distance (a stretched spring pulls harder). ---
                for (const edge of graphEdges) {
                    const fromNode = nodeLookup.get(edge.fromId);
                    const toNode = nodeLookup.get(edge.toId);
                    if (!fromNode || !toNode) continue;
                    let deltaX = fromNode.x - toNode.x;
                    let deltaY = fromNode.y - toNode.y;
                    let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY) || 0.01;
                    const attraction = (distance * distance) / idealDistance;
                    const pullX = (deltaX / distance) * attraction;
                    const pullY = (deltaY / distance) * attraction;
                    fromNode.velocityX -= pullX; fromNode.velocityY -= pullY;
                    toNode.velocityX += pullX; toNode.velocityY += pullY;
                }

                // --- a pull toward the centre so disconnected pieces stay a compact
                //     cluster instead of drifting apart. This used to be VERY weak
                //     (0.003) to avoid an old bug where edge-less nodes collapsed into a
                //     pile -- but the hard MIN_SEPARATION pass below now guarantees no
                //     two nodes overlap regardless, so we can safely use a firmer pull
                //     (0.02). Firmer pull => tighter graph => a sensible fit zoom. ---
                const CENTRE_PULL = 0.02;
                for (const node of graphNodes) {
                    node.velocityX += (centreX - node.x) * CENTRE_PULL;
                    node.velocityY += (centreY - node.y) * CENTRE_PULL;
                }

                // --- apply the accumulated velocity, but never move a node further than the
                //     current temperature in one round; then cool down so motion settles. ---
                for (const node of graphNodes) {
                    let speed = Math.sqrt(node.velocityX * node.velocityX + node.velocityY * node.velocityY) || 0.01;
                    node.x += (node.velocityX / speed) * Math.min(speed, temperature);
                    node.y += (node.velocityY / speed) * Math.min(speed, temperature);
                }
                temperature *= 0.98;   // cooling schedule
            }

            // --- Hard minimum-separation pass. Whatever the simulation produced, no two
            //     nodes may end up closer than MIN_SEPARATION, so they can never visually
            //     overlap. Repeated relaxation rounds push any too-close pair apart until
            //     none remain (or we hit the round cap). A safety net on top of the
            //     repulsion above, not a replacement for it.
            //
            //     Also grid-accelerated: two nodes can only violate MIN_SEPARATION if
            //     they are within it, so with a cell size of MIN_SEPARATION only the
            //     3x3 neighbourhood can contain a violating partner. The grid is rebuilt
            //     each round because positions move as we push pairs apart. We give each
            //     node a stable index so a pair is handled once per round (i < j), even
            //     though the grid yields both orderings. ---
            const MIN_SEPARATION = 70;
            for (let n = 0; n < nodeCount; n++) graphNodes[n]._idx = n;
            for (let round = 0; round < 60; round++) {
                let anyMoved = false;
                const sepGrid = buildGrid(graphNodes, MIN_SEPARATION);
                for (const a of graphNodes) {
                    for (const b of sepGrid.neighbours(a)) {
                        if (b._idx <= a._idx) continue;   // handle each pair once (i < j)
                        let deltaX = b.x - a.x;
                        let deltaY = b.y - a.y;
                        let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                        if (distance < MIN_SEPARATION) {
                            // exactly coincident: pick a deterministic direction to split them.
                            if (distance < 0.001) { deltaX = Math.cos(a._idx * 1.7); deltaY = Math.sin(a._idx * 1.7); distance = 1; }
                            const pushEach = (MIN_SEPARATION - distance) / 2;
                            const unitX = deltaX / distance, unitY = deltaY / distance;
                            a.x -= unitX * pushEach; a.y -= unitY * pushEach;
                            b.x += unitX * pushEach; b.y += unitY * pushEach;
                            anyMoved = true;
                        }
                    }
                }
                if (!anyMoved) break;
            }
        }

        // ===========================================================================
        // Step 4: draw the current graph as SVG (edges first, then nodes on top).
        // ===========================================================================
        const NODE_RADIUS = 13;

        function render() {
            const edgesLayer = byElementId("edges-layer");
            const nodesLayer = byElementId("nodes-layer");
            edgesLayer.textContent = "";   // clear previous drawing
            nodesLayer.textContent = "";

            // --- edges (drawn first so nodes sit visually on top of them) ---
            for (const edge of graphEdges) {
                const fromNode = nodeLookup.get(edge.fromId);
                const toNode = nodeLookup.get(edge.toId);
                if (!fromNode || !toNode) continue;

                // an edge is highlighted only if BOTH its endpoints are in the MATCH path.
                const isHighlighted = highlightedNodeIds.has(edge.fromId) && highlightedNodeIds.has(edge.toId);

                // Shorten the line at each end by the node radius, so the line (and its
                // arrowhead) meets the rim of the circle rather than its centre.
                const deltaX = toNode.x - fromNode.x;
                const deltaY = toNode.y - fromNode.y;
                const length = Math.sqrt(deltaX * deltaX + deltaY * deltaY) || 1;
                const unitX = deltaX / length, unitY = deltaY / length;
                const startX = fromNode.x + unitX * NODE_RADIUS, startY = fromNode.y + unitY * NODE_RADIUS;
                const endX = toNode.x - unitX * NODE_RADIUS, endY = toNode.y - unitY * NODE_RADIUS;

                const lineEl = document.createElementNS(SVG_NAMESPACE, "line");
                lineEl.setAttribute("x1", startX); lineEl.setAttribute("y1", startY);
                lineEl.setAttribute("x2", endX); lineEl.setAttribute("y2", endY);
                lineEl.setAttribute("class", "edge" + (isHighlighted ? " hl" : ""));
                lineEl.setAttribute("marker-end", isHighlighted ? "url(#arrow-hl)" : "url(#arrow)");
                edgesLayer.appendChild(lineEl);

                if (edge.label) {
                    const labelEl = document.createElementNS(SVG_NAMESPACE, "text");
                    labelEl.setAttribute("x", (startX + endX) / 2);
                    labelEl.setAttribute("y", (startY + endY) / 2 - 3);
                    labelEl.setAttribute("text-anchor", "middle");
                    labelEl.setAttribute("class", "edge-label");
                    labelEl.textContent = edge.label;
                    edgesLayer.appendChild(labelEl);
                }
            }

            // --- nodes ---
            for (const node of graphNodes) {
                const groupEl = document.createElementNS(SVG_NAMESPACE, "g");
                let className = "node";
                if (highlightedNodeIds.has(node.id)) className += " hl";
                if (node.id === selectedNodeId) className += " selected";
                groupEl.setAttribute("class", className);
                groupEl.setAttribute("transform", `translate(${node.x},${node.y})`);
                groupEl.dataset.id = node.id;

                const circleEl = document.createElementNS(SVG_NAMESPACE, "circle");
                circleEl.setAttribute("r", NODE_RADIUS);
                circleEl.setAttribute("fill", colourForLabel(node.label));
                groupEl.appendChild(circleEl);

                const labelEl = document.createElementNS(SVG_NAMESPACE, "text");
                labelEl.setAttribute("class", "node-label");
                labelEl.setAttribute("y", -NODE_RADIUS - 5);
                // caption preference: a name/title property, else the label, else "#id".
                const properties = node.properties || {};
                labelEl.textContent = properties.name || properties.title || node.label || ("#" + node.id);
                groupEl.appendChild(labelEl);

                attachNodePointerHandlers(groupEl, node);
                nodesLayer.appendChild(groupEl);
            }
        }

        // ===========================================================================
        // Camera (pan / zoom) + coordinate conversion.
        // ===========================================================================
        // Push the current camera onto the SVG group that wraps the whole drawing.
        function applyCamera() {
            byElementId("viewport").setAttribute(
                "transform",
                `translate(${camera.panX},${camera.panY}) scale(${camera.zoom})`);
        }

        // Convert a screen (client) pixel position into the drawing's coordinate space,
        // undoing the current pan and zoom. Used when dragging a node so the node
        // follows the cursor correctly at any zoom level.
        function screenToWorld(clientX, clientY) {
            const svgEl = byElementId("svg");
            const rect = svgEl.getBoundingClientRect();
            return {
                x: (clientX - rect.left - camera.panX) / camera.zoom,
                y: (clientY - rect.top - camera.panY) / camera.zoom
            };
        }

        // ===========================================================================
        // Node interaction: press-and-drag to move a node; a press with no movement is
        // treated as a click that selects the node.
        // ===========================================================================
        let draggingNode = null;      // the node currently being dragged, or null
        let dragDidMove = false;      // did the pointer actually move during this press?

        function attachNodePointerHandlers(groupEl, node) {
            groupEl.addEventListener("pointerdown", (event) => {
                event.stopPropagation();                 // don't also start a canvas pan
                draggingNode = node;
                dragDidMove = false;
                groupEl.setPointerCapture(event.pointerId);
            });
            groupEl.addEventListener("pointermove", (event) => {
                if (draggingNode !== node) return;
                const world = screenToWorld(event.clientX, event.clientY);
                node.x = world.x; node.y = world.y;
                dragDidMove = true;
                render();
            });
            groupEl.addEventListener("pointerup", (event) => {
                // a press that never moved = a click -> select this node.
                if (draggingNode === node && !dragDidMove) selectNode(node);
                draggingNode = null;
                try { groupEl.releasePointerCapture(event.pointerId); } catch (e) { }
            });
        }

        function selectNode(node) {
            selectedNodeId = node.id;
            render();
            renderSelectionPanel(node);
        }

        // ===========================================================================
        // Canvas pan (drag the background) and wheel zoom (centred on the cursor).
        // ===========================================================================
        (function setUpCanvasPanAndZoom() {
            const svgEl = byElementId("svg");
            let isPanning = false;
            let panStartX = 0, panStartY = 0;   // pointer position where the pan began
            let panOriginX = 0, panOriginY = 0; // camera pan at the moment the pan began

            svgEl.addEventListener("pointerdown", (event) => {
                isPanning = true;
                svgEl.classList.add("panning");
                panStartX = event.clientX; panStartY = event.clientY;
                panOriginX = camera.panX; panOriginY = camera.panY;
            });
            window.addEventListener("pointermove", (event) => {
                if (!isPanning) return;
                camera.panX = panOriginX + (event.clientX - panStartX);
                camera.panY = panOriginY + (event.clientY - panStartY);
                applyCamera();
            });
            window.addEventListener("pointerup", () => {
                isPanning = false;
                svgEl.classList.remove("panning");
            });

            // Wheel zoom. We scale about the cursor: the world point currently under the
            // cursor must stay under the cursor after zooming, which is what the panX/panY
            // adjustment below achieves.
            svgEl.addEventListener("wheel", (event) => {
                event.preventDefault();
                const zoomFactor = event.deltaY < 0 ? 1.1 : (1 / 1.1);   // wheel up = zoom in
                const rect = svgEl.getBoundingClientRect();
                const cursorX = event.clientX - rect.left;
                const cursorY = event.clientY - rect.top;
                camera.panX = cursorX - (cursorX - camera.panX) * zoomFactor;
                camera.panY = cursorY - (cursorY - camera.panY) * zoomFactor;
                camera.zoom *= zoomFactor;
                applyCamera();
            }, { passive: false });
        })();

        // ===========================================================================
        // Fit: pan/zoom the camera so the whole graph is visible and centred.
        // ===========================================================================
        function fitToView() {
            if (graphNodes.length === 0) {
                camera = { panX: 0, panY: 0, zoom: 1 };
                applyCamera();
                return;
            }
            // bounding box of all node positions
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const node of graphNodes) {
                minX = Math.min(minX, node.x); maxX = Math.max(maxX, node.x);
                minY = Math.min(minY, node.y); maxY = Math.max(maxY, node.y);
            }
            const PADDING = 60;
            const svgEl = byElementId("svg");
            const viewWidth = svgEl.clientWidth, viewHeight = svgEl.clientHeight;
            const graphWidth = (maxX - minX) || 1;
            const graphHeight = (maxY - minY) || 1;

            // pick the zoom that fits both dimensions (capped at 2x so tiny graphs don't
            // balloon), then centre the bounding box in the view. A lower bound of 0.05
            // stops a pathologically large spread from zooming so far out that nodes
            // render sub-pixel and effectively vanish -- with the compact layout above
            // this floor should rarely bind, but it guarantees nodes are always visible.
            const zoom = Math.max(0.05, Math.min(
                viewWidth / (graphWidth + PADDING * 2),
                viewHeight / (graphHeight + PADDING * 2),
                2));
            camera.zoom = zoom;
            camera.panX = (viewWidth - graphWidth * zoom) / 2 - minX * zoom;
            camera.panY = (viewHeight - graphHeight * zoom) / 2 - minY * zoom;
            applyCamera();
        }

        // ===========================================================================
        // Side panel: the selected node's details, and the label legend.
        // ===========================================================================
        function renderSelectionPanel(node) {
            const panelEl = byElementId("detail");
            if (!node) {
                panelEl.innerHTML = '<p class="empty">Click a node to see its properties.</p>';
                return;
            }
            const colour = colourForLabel(node.label);
            let html =
                `<div style="margin-bottom:8px">
               <span class="badge" style="background:${colour}">${escapeHtml(node.label || "(no label)")}</span>
               <span style="color:var(--ink-muted); font-size:12px; margin-left:6px">id ${node.id}</span>
             </div>`;

            const properties = node.properties || {};
            const propertyKeys = Object.keys(properties);
            if (propertyKeys.length === 0) {
                html += '<p class="empty">No properties.</p>';
            } else {
                html += '<dl class="kv">';
                for (const key of propertyKeys)
                    html += `<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(String(properties[key]))}</dd>`;
                html += '</dl>';
            }
            panelEl.innerHTML = html;
        }

        function renderLegend() {
            // distinct labels, in first-seen order
            const labelsSeen = [];
            for (const node of graphNodes) {
                const label = node.label || "(no label)";
                if (!labelsSeen.includes(label)) labelsSeen.push(label);
            }
            const legendEl = byElementId("legend");
            if (labelsSeen.length === 0) { legendEl.innerHTML = ""; return; }

            let html = "<h2>Labels</h2>";
            for (const label of labelsSeen) {
                const swatchColour = colourForLabel(label === "(no label)" ? "" : label);
                html += `<div class="row"><span class="sw" style="background:${swatchColour}"></span>${escapeHtml(label)}</div>`;
            }
            if (highlightedNodeIds.size) {
                html += `<div class="row" style="margin-top:8px"><span class="sw" style="background:var(--highlight)"></span>MATCH path</div>`;
            }
            legendEl.innerHTML = html;
        }

        // Escape user/DB-supplied text before putting it in innerHTML (labels and
        // property values could contain <, &, quotes, etc.).
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, ch =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
        }

        // ===========================================================================
        // Refresh: re-run the last graph query (SELECT / MATCH) to pull in the effect
        // of a mutation (INSERT / UPDATE / DELETE) on demand. Always available: if a
        // graph query has been run, it replays that (putting it back in the box so it's
        // visible what ran); if none has yet, it just runs whatever is in the box now
        // (identical to Run), so the button is never a dead no-op.
        // ===========================================================================
        function refreshGraph() {
            if (lastReadQuery !== null)
                byElementId("query").value = lastReadQuery;
            runQuery();
        }

        // ===========================================================================
        // Wire up the controls.
        // ===========================================================================
        byElementId("run").addEventListener("click", runQuery);
        byElementId("refresh").addEventListener("click", refreshGraph);
        byElementId("fit").addEventListener("click", fitToView);
        byElementId("query").addEventListener("keydown", (event) => {
            if (event.key === "Enter") runQuery();
        });
        applyCamera();
    </script>
</body>
</html>
